name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # No GROQ_API_KEY needed - tests mock the client, and the build only
      # needs the key at runtime, not at build time.
      - run: npm run build
